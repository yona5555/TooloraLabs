version: 2
updates:
  # One root lockfile covers every npm workspace (apps/web, packages/*).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Riyadh
    # Version updates wait 7 days after a release; security updates are never delayed.
    cooldown:
      default-days: 7
    # Minor/patch are grouped and auto-merged (dependabot-automerge.yml); majors stay one PR each.
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
      npm-security-minor-and-patch:
        applies-to: security-updates
        update-types: [minor, patch]

  # Keeps the SHA-pinned actions (and their version comments) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Riyadh
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
