name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Typecheck (core)
        run: npx tsc --noEmit --project packages/core/tsconfig.json

      - name: Typecheck (sdk)
        run: npx tsc --noEmit --project packages/sdk/tsconfig.json

      - name: Typecheck (tools)
        run: npx tsc --noEmit --project packages/tools/tsconfig.json

      - name: Test (core)
        run: npm run test --workspace=packages/core

      - name: Test (sdk)
        run: npm run test --workspace=packages/sdk

      - name: Test (tools)
        run: npm run test --workspace=packages/tools

      - name: Validate JSON (locale messages, data, approved previews)
        run: npm run check:json

      - name: Build web app
        run: npm run build --workspace=apps/web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Served tool-card previews (approved hash, contain, not cropped)
        working-directory: apps/web
        run: |
          npx next start -p 3001 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3001/en/tools && break; sleep 2; done
          npm run test:cards
