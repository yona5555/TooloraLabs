name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Typecheck (core)
        run: npx tsc --noEmit --project packages/core/tsconfig.json

      - name: Typecheck (sdk)
        run: npx tsc --noEmit --project packages/sdk/tsconfig.json

      - name: Typecheck (tools)
        run: npx tsc --noEmit --project packages/tools/tsconfig.json

      - name: Test (core)
        run: npm run test --workspace=packages/core

      - name: Test (sdk)
        run: npm run test --workspace=packages/sdk

      - name: Test (tools)
        run: npm run test --workspace=packages/tools

      - name: Validate JSON (locale messages, data, approved previews)
        run: npm run check:json

      - name: Build web app
        run: npm run build --workspace=apps/web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Served tool-card previews + LOCKED phone card order and zero duplicate ids (every tool at 390px)
        working-directory: apps/web
        run: |
          npx next start -p 3001 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3001/en/tools && break; sleep 2; done
          npm run test:cards
          node ../../tests/phone-card-order.mjs --ids http://localhost:3001 en

  # The approved phone home page is locked (.claude/rules/visuals.md, "APPROVED — LOCKED").
  # Chromium only, so no macOS runner is needed. The page uses system fonts (Arial), so each OS has
  # its own baseline: tests/baselines/home-phone.json (macOS, local) and home-phone.linux.json (this runner).
  # Runner moved from macOS to Ubuntu with Yousef's approval (2026-10-25).
  # The PR label "approve-home-phone-baseline" is the CI form of --approve: it rewrites the Linux
  # baseline and uploads it as an artifact to be reviewed and committed.
  home-phone-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build --workspace=apps/web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Approved phone home page unchanged (rects, fonts, texts, order)
        working-directory: apps/web
        run: |
          npx next start -p 3001 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3001/en && break; sleep 2; done
          cd ../..
          if [ "$APPROVE_BASELINE" = "true" ]; then npm run baseline:home-phone -- --approve; fi
          npm run test:home-phone
        env:
          APPROVE_BASELINE: ${{ contains(github.event.pull_request.labels.*.name, 'approve-home-phone-baseline') }}

      - name: Upload the rewritten Linux baseline
        if: contains(github.event.pull_request.labels.*.name, 'approve-home-phone-baseline')
        uses: actions/upload-artifact@v7
        with:
          name: home-phone-linux-baseline
          path: tests/baselines/home-phone.linux.json

  # The approved desktop layout is locked (DESKTOP phase, 2026-10-26): every tool page plus /, /tools,
  # /categories and /docs at 1440px, en + ar (tests/desktop-lock.mjs). Same OS split as the phone lock:
  # tests/baselines/desktop.json (macOS, local) and desktop.linux.json (this runner). The PR label
  # "approve-desktop-baseline" is the CI form of --approve: it rewrites the Linux baseline and uploads it
  # as an artifact to be reviewed and committed.
  desktop-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build --workspace=apps/web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Approved desktop layout unchanged (cards, charts, row layouts, headings, fonts)
        working-directory: apps/web
        run: |
          npx next start -p 3001 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3001/en && break; sleep 2; done
          cd ../..
          if [ "$APPROVE_BASELINE" = "true" ]; then npm run baseline:desktop-lock -- --approve; fi
          npm run test:desktop-lock
        env:
          APPROVE_BASELINE: ${{ contains(github.event.pull_request.labels.*.name, 'approve-desktop-baseline') }}

      - name: Upload the rewritten Linux baseline
        if: contains(github.event.pull_request.labels.*.name, 'approve-desktop-baseline')
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-baseline
          path: tests/baselines/desktop.linux.json
