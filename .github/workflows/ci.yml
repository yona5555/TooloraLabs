name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # labeled: adding an approve-*-baseline label starts a run that sees it (labels are read from the
    # event, so a label added after the last push is otherwise ignored until the next push).
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# A newer push to the same PR supersedes its running checks (they would only queue behind each other).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default. regenerate-baselines writes with a GitHub App installation token, not GITHUB_TOKEN.
permissions:
  contents: read

# Every run step is bash with pipefail (bash --noprofile --norc -eo pipefail): a failure anywhere in a pipeline
# fails the step, so no pipe can hide a gate's exit code (scripts/workflow-shell.mjs enforces this on every
# workflow file, including this one, via the gates-self-test canary).
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        uses: ./.github/actions/npm-ci
        with:
          save-cache: "true"

      - name: Workflow rules (bash with pipefail, only a push to main saves a cache)
        run: |
          node scripts/workflow-shell.mjs
          node scripts/cache-policy.mjs

      # Lint, tests and the build run through the warnings gate (scripts/run-no-warnings.mjs): any warning or
      # error line from a tool fails the step, not only a non-zero exit.
      - name: Lint (zero warnings)
        run: node scripts/run-no-warnings.mjs npm run lint --workspace=apps/web

      - name: Typecheck (core)
        run: npx tsc --noEmit --project packages/core/tsconfig.json

      - name: Typecheck (sdk)
        run: npx tsc --noEmit --project packages/sdk/tsconfig.json

      - name: Typecheck (tools)
        run: npx tsc --noEmit --project packages/tools/tsconfig.json

      - name: Test (core)
        run: node scripts/run-no-warnings.mjs npm run test --workspace=packages/core

      - name: Test (sdk)
        run: node scripts/run-no-warnings.mjs npm run test --workspace=packages/sdk

      - name: Test (tools)
        run: node scripts/run-no-warnings.mjs npm run test --workspace=packages/tools

      - name: Test (web lib, market API keys)
        run: node scripts/run-no-warnings.mjs npm run test --workspace=apps/web

      - name: Test (warnings gate patterns)
        run: node scripts/run-no-warnings.mjs npm run test:gate

      - name: Validate JSON (locale messages, data, approved previews)
        run: npm run check:json

      - name: Test (main-health script, mocked GitHub API)
        run: node scripts/run-no-warnings.mjs npm run test:main-health

      - name: Test (color lock comparison, desktop + phone home locks)
        run: node scripts/run-no-warnings.mjs npm run test:color-lock

      # Any warning line in the build output (Next.js ⚠, webpack, React, Node, npm) fails the step.
      # Next.js build cache (https://nextjs.org/docs/messages/no-cache): restored from main's last build; only a
      # push to main saves it (scripts/cache-policy.mjs). home-phone-lock and the phone build of gates-self-test
      # run the same command on the same path, so they share this key; the .next-lock builds differ
      # (NEXT_DIST_DIR, fixture fetches) and keep their own.
      - name: Restore the Next.js build cache
        id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/next.config.ts', 'apps/web/package.json') }}-${{ hashFiles('apps/web/app/**', 'apps/web/components/**', 'apps/web/lib/**', 'apps/web/data/**', 'apps/web/messages/**', 'packages/*/src/**') }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/next.config.ts', 'apps/web/package.json') }}-
            next-build-${{ runner.os }}-

      - name: Build web app (zero warnings)
        id: build
        # A miss on an empty cache (evicted, or main's first run) leaves no .next/cache, and Next.js then warns that
        # caching is not configured; it is, so the directory is created and the cold build runs.
        run: |
          mkdir -p apps/web/.next/cache
          node scripts/run-no-warnings.mjs npm run build --workspace=apps/web

      - name: Save the Next.js build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && always() && steps.build.outcome != 'skipped' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test (hydration guard fails a real server/client date mismatch)
        run: node scripts/run-no-warnings.mjs npm run test:hydration-guard

      - name: Served tool-card previews + LOCKED phone card order and zero duplicate ids (every tool at 390px)
        # Test servers use the dedicated port 3110 (never 3001, the dev server's) through scripts/test-server.sh:
        # it fails if the port is taken and stops only the server it started.
        run: |
          scripts/test-server.sh start 3110 apps/web /en/tools
          BASE=http://localhost:3110 npm run test:cards --workspace=apps/web
          node tests/phone-card-order.mjs --ids http://localhost:3110 en
          scripts/test-server.sh stop 3110

  # The approved phone home page is locked (.claude/rules/visuals.md, "APPROVED — LOCKED").
  # Chromium only, so no macOS runner is needed. The page uses system fonts (Arial), so each OS has
  # its own baseline: tests/baselines/home-phone.json (macOS, local) and home-phone.linux.json (this runner).
  # Runner moved from macOS to Ubuntu with xzerone's approval (2026-10-25).
  # Baseline approval is the label "approve-home-phone-baseline" (see regenerate-baselines). While it is on
  # the PR this required check fails at once, so the PR can never merge before the new baseline is committed.
  home-phone-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: No merge while a baseline approval is in progress
        if: contains(github.event.pull_request.labels.*.name, 'approve-home-phone-baseline')
        run: |
          echo "::error::Baseline approval in progress: waiting for regenerate-baselines to commit the new baseline"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      # Same build as the build job, same cache key; that job saves it on main.
      - name: Restore the Next.js build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/next.config.ts', 'apps/web/package.json') }}-${{ hashFiles('apps/web/app/**', 'apps/web/components/**', 'apps/web/lib/**', 'apps/web/data/**', 'apps/web/messages/**', 'packages/*/src/**') }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/next.config.ts', 'apps/web/package.json') }}-
            next-build-${{ runner.os }}-

      - name: Build web app
        run: npm run build --workspace=apps/web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Approved phone home page unchanged (rects, fonts, texts, order)
        # Ready check and warm-up of both pages under test (/en, /ar) before the test; dedicated port 3110.
        run: |
          scripts/test-server.sh start 3110 apps/web /ar
          npm run test:home-phone -- --base http://localhost:3110
          scripts/test-server.sh stop 3110

  # The approved desktop layout is locked (DESKTOP phase, 2026-10-26), tests/desktop-lock.mjs. CI checks the
  # home page plus 12 representative tools at 1440px, en + ar; the full 204-page check is the local
  # npm run test:desktop-lock:full. The build and its server answer every external fetch from
  # tests/fixtures/live (tests/fixtures/offline-fetch.mjs), so no page waits on the network and every wait is
  # bounded. Same OS split as the phone lock: tests/baselines/desktop.json (macOS, local) and
  # desktop.linux.json (this runner). Baseline approval is the label "approve-desktop-baseline" (see
  # regenerate-baselines); while it is on the PR this required check fails at once.
  desktop-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: No merge while a baseline approval is in progress
        if: contains(github.event.pull_request.labels.*.name, 'approve-desktop-baseline')
        run: |
          echo "::error::Baseline approval in progress: waiting for regenerate-baselines to commit the new baseline"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      # The fixture build's cache: restored from main's last build; only a push to main saves it, from this job.
      - name: Restore the Next.js build cache
        id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next-lock/cache
          key: next-lock-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/next.config.ts', 'apps/web/package.json') }}-${{ hashFiles('apps/web/app/**', 'apps/web/components/**', 'apps/web/lib/**', 'apps/web/data/**', 'apps/web/messages/**', 'packages/*/src/**') }}
          restore-keys: |
            next-lock-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/next.config.ts', 'apps/web/package.json') }}-
            next-lock-${{ runner.os }}-

      - name: Build web app (live data from fixtures)
        id: build
        run: npm run build:desktop-lock

      - name: Save the Next.js build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && always() && steps.build.outcome != 'skipped' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next-lock/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Approved desktop layout unchanged (cards, charts, row layouts, headings, fonts)
        run: npm run test:desktop-lock -- --timing desktop-lock-timing.txt

      - name: Upload the per-page timing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-lock-timing
          path: desktop-lock-timing.txt
          if-no-files-found: ignore

  # Affected pages (scripts/route-manifest.mjs): a route-level manifest of this build (every chunk each page's
  # HTML/RSC loads, plus its own server bundle for a request-rendered page), diffed against main's manifest
  # (artifact route-manifest of main's latest successful run) to list only the routes this change could affect -
  # unchanged chunks mark nothing, a shared chunk marks every route that loads it. Without a base manifest every
  # route is affected and the step says why. site-audit and perf-budget shard only this list on a PR/push; the
  # daily schedule (scripts/launch-readiness.mjs) always audits every page.
  affected:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # actions: read lists main's runs and downloads their manifest artifact.
    permissions:
      contents: read
      actions: read
    outputs:
      count: ${{ steps.pages.outputs.count }}
      audit-shards: ${{ steps.pages.outputs.audit-shards }}
      audit-shard-count: ${{ steps.pages.outputs.audit-shard-count }}
      perf-shards: ${{ steps.pages.outputs.perf-shards }}
      perf-shard-count: ${{ steps.pages.outputs.perf-shard-count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      - name: Restore the Next.js build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next-lock/cache
          key: next-lock-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/next.config.ts', 'apps/web/package.json') }}-${{ hashFiles('apps/web/app/**', 'apps/web/components/**', 'apps/web/lib/**', 'apps/web/data/**', 'apps/web/messages/**', 'packages/*/src/**') }}
          restore-keys: |
            next-lock-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/next.config.ts', 'apps/web/package.json') }}-
            next-lock-${{ runner.os }}-

      - name: Fetch main's route manifest (its absence marks every page affected)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/base-route-manifest.sh base-route-manifest.json

      - name: Build web app (live data from fixtures)
        run: npm run build:desktop-lock

      - name: Affected pages
        id: pages
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node scripts/route-manifest.mjs build apps/web/.next-lock route-manifest.json
          node scripts/route-manifest.mjs affected base-route-manifest.json route-manifest.json affected-pages.txt
          count=$(( $(wc -l < affected-pages.txt) ))
          # Shards sized so a PR with every page affected still fits the per-shard timeout: site-audit ~4.6s/page
          # (en+ar, 2 widths, 2 themes); the deterministic budgets take one short browser load per page.
          audit=$(( count ? (count + 59) / 60 : 0 )); (( audit > 12 )) && audit=12
          perf=$(( count ? (count + 149) / 150 : 0 )); (( perf > 16 )) && perf=16
          shards() { if (( $1 )); then echo "[$(seq -s, 1 "$1")]"; else echo "[]"; fi; }
          { echo "count=$count"; echo "audit-shards=$(shards "$audit")"; echo "audit-shard-count=$audit"; echo "perf-shards=$(shards "$perf")"; echo "perf-shard-count=$perf"; } >> "$GITHUB_OUTPUT"
          echo "$count affected pages: site-audit $audit shards, perf-budget $perf shards" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the affected pages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: affected-pages
          path: affected-pages.txt

      - name: Upload this commit's route manifest (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: route-manifest
          path: route-manifest.json
          retention-days: 90

  # Site audit (apps/web/scripts/site-audit.mjs): every affected page (the sitemap minus what `affected` ruled
  # out), en + ar, 1440 and 390 px, light and dark. Measures overlap, clip, small text, hydration, console,
  # a11y and broken links, then scripts/ratchet.mjs decides pass/fail: a required check fails only if one of
  # these MEASURED pages got WORSE than its .audit/ratchet/site-audit.json entry, or a page with no entry has
  # any finding at all. Zero across the whole site is not required here - that is launch-readiness, daily on
  # main, not required on PRs. Twelve shards in parallel; `site-audit` is the single required check over them.
  site-audit-shard:
    needs: affected
    if: needs.affected.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.affected.outputs.audit-shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      - name: Restore the Next.js build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next-lock/cache
          key: next-lock-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/next.config.ts', 'apps/web/package.json') }}-${{ hashFiles('apps/web/app/**', 'apps/web/components/**', 'apps/web/lib/**', 'apps/web/data/**', 'apps/web/messages/**', 'packages/*/src/**') }}
          restore-keys: |
            next-lock-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/next.config.ts', 'apps/web/package.json') }}-
            next-lock-${{ runner.os }}-

      - name: Build web app (live data from fixtures)
        run: npm run build:desktop-lock

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Download the affected pages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: affected-pages

      - name: Site audit (shard ${{ matrix.shard }}/${{ needs.affected.outputs.audit-shard-count }})
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.affected.outputs.audit-shard-count }}
          PAGES: ${{ github.workspace }}/affected-pages.txt
          OUT: ${{ github.workspace }}/site-audit-${{ matrix.shard }}.json
          # Measure only: findings are the ratchet's to judge (launch-readiness runs the hard zero-tolerance gate),
          # and a hard gate's ::error here would fail zero-warnings on a page that did not regress. A broken run
          # still fails this step.
          RATCHET_MEASURE: 1
        run: scripts/site-audit.sh 3107

      # !cancelled(): when the audit broke, the ratchet still runs and names what is missing.
      - name: This shard's exact page list
        if: ${{ !cancelled() }}
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.affected.outputs.audit-shard-count }}
        run: node scripts/expand-measured-pages.mjs site-audit affected-pages.txt "$SHARD" ${{ github.workspace }}/measured-${{ matrix.shard }}.txt

      - name: Ratchet check (shard ${{ matrix.shard }})
        if: ${{ !cancelled() }}
        env:
          MEASURED: ${{ github.workspace }}/measured-${{ matrix.shard }}.txt
        run: node scripts/ratchet.mjs check site-audit site-audit-${{ matrix.shard }}.json .audit/ratchet/site-audit.json

      - name: Upload the inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-audit-${{ matrix.shard }}
          path: site-audit-${{ matrix.shard }}.json
          if-no-files-found: ignore

  site-audit:
    if: always()
    needs: [affected, site-audit-shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Every site audit shard passed the ratchet (or no page is affected)
        env:
          AFFECTED: ${{ needs.affected.result }}
          COUNT: ${{ needs.affected.outputs.count }}
          RESULT: ${{ needs.site-audit-shard.result }}
        run: |
          if [ "$AFFECTED" != "success" ]; then echo "::error::affected: $AFFECTED"; exit 1; fi
          if [ "$COUNT" = "0" ]; then echo "No page is affected by this change: nothing to audit."; exit 0; fi
          if [ "$RESULT" != "success" ]; then
            echo "::error::site-audit-shard result: $RESULT (see the shard logs and the site-audit-* artifacts)"
            exit 1
          fi

  # Deterministic performance budgets (apps/web/scripts/perf-static.mjs) on every affected page: initial JS and CSS
  # bytes, render-blocking resources, requests, LCP element in the server HTML. scripts/ratchet.mjs then decides
  # pass/fail as for site-audit, with no tolerance: two runs of one build give identical values. Lighthouse timing
  # is not a PR gate (two CI runs of the same code differed by up to 1.7 s of LCP): it runs in launch-readiness,
  # daily on main, 5 runs per page, median. `perf-budget` is the single required check over the shards.
  perf-budget-shard:
    needs: affected
    if: needs.affected.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.affected.outputs.perf-shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      - name: Restore the Next.js build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next-lock/cache
          key: next-lock-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/next.config.ts', 'apps/web/package.json') }}-${{ hashFiles('apps/web/app/**', 'apps/web/components/**', 'apps/web/lib/**', 'apps/web/data/**', 'apps/web/messages/**', 'packages/*/src/**') }}
          restore-keys: |
            next-lock-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/next.config.ts', 'apps/web/package.json') }}-
            next-lock-${{ runner.os }}-

      - name: Build web app (production, live data from fixtures)
        run: npm run build:desktop-lock

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Download the affected pages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: affected-pages

      - name: Deterministic budgets (shard ${{ matrix.shard }}/${{ needs.affected.outputs.perf-shard-count }})
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.affected.outputs.perf-shard-count }}
          PAGES: ${{ github.workspace }}/affected-pages.txt
          OUT: ${{ github.workspace }}/perf-budget-${{ matrix.shard }}.json
          # Measure only, as in site-audit-shard: the ratchet below judges the numbers.
          RATCHET_MEASURE: 1
        run: scripts/perf-static.sh 3108

      # !cancelled(): when the run broke, the ratchet still runs and names what is missing.
      - name: This shard's exact page list
        if: ${{ !cancelled() }}
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.affected.outputs.perf-shard-count }}
        run: node scripts/expand-measured-pages.mjs perf-budget affected-pages.txt "$SHARD" ${{ github.workspace }}/measured-${{ matrix.shard }}.txt

      - name: Ratchet check (shard ${{ matrix.shard }})
        if: ${{ !cancelled() }}
        env:
          MEASURED: ${{ github.workspace }}/measured-${{ matrix.shard }}.txt
        run: node scripts/ratchet.mjs check perf-budget perf-budget-${{ matrix.shard }}.json .audit/ratchet/perf-budget.json

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-budget-${{ matrix.shard }}
          path: perf-budget-${{ matrix.shard }}.json
          if-no-files-found: ignore

  perf-budget:
    if: always()
    needs: [affected, perf-budget-shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Every performance budget shard passed the ratchet (or no page is affected)
        env:
          AFFECTED: ${{ needs.affected.result }}
          COUNT: ${{ needs.affected.outputs.count }}
          RESULT: ${{ needs.perf-budget-shard.result }}
        run: |
          if [ "$AFFECTED" != "success" ]; then echo "::error::affected: $AFFECTED"; exit 1; fi
          if [ "$COUNT" = "0" ]; then echo "No page is affected by this change: nothing to measure."; exit 0; fi
          if [ "$RESULT" != "success" ]; then
            echo "::error::perf-budget-shard result: $RESULT (see the shard logs and the perf-budget-* artifacts)"
            exit 1
          fi

  # Gate canaries (tests/gates-self-test.mjs): every required or quality gate added so far runs on a minimal,
  # deliberately broken fixture and must fail on it, naming the defect: lint and warnings gates, zero-warnings,
  # the system font and workflow shell rules, the site audit (overlap, SVG clip, HTML clip, text < 12px,
  # hydration mismatch, console error, contrast, broken link), the performance budgets (a page over each
  # budget), affected pages, share-images (missing og:image), desktop lock, phone lock and main-health (failed
  # run). A gate that passes its broken fixture fails this job.
  gates-self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      - name: Restore the Next.js build cache (fixture build)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next-lock/cache
          key: next-lock-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/next.config.ts', 'apps/web/package.json') }}-${{ hashFiles('apps/web/app/**', 'apps/web/components/**', 'apps/web/lib/**', 'apps/web/data/**', 'apps/web/messages/**', 'packages/*/src/**') }}
          restore-keys: |
            next-lock-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/next.config.ts', 'apps/web/package.json') }}-
            next-lock-${{ runner.os }}-

      - name: Restore the Next.js build cache (phone build)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/next.config.ts', 'apps/web/package.json') }}-${{ hashFiles('apps/web/app/**', 'apps/web/components/**', 'apps/web/lib/**', 'apps/web/data/**', 'apps/web/messages/**', 'packages/*/src/**') }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/next.config.ts', 'apps/web/package.json') }}-
            next-build-${{ runner.os }}-

      - name: Build web app (fixture build for the desktop lock canary, phone build for the phone lock canary)
        run: |
          npm run build:desktop-lock
          npm run build --workspace=apps/web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Every gate fails on its broken fixture
        run: |
          scripts/test-server.sh start 3110 apps/web /ar
          status=0
          PHONE_BASE=http://localhost:3110 npm run test:gates-self-test || status=$?
          scripts/test-server.sh stop 3110
          exit "$status"


  # Baseline approval, in this order: (1) a label approve-desktop-baseline / approve-home-phone-baseline on a
  # same-repository PR starts this job, and the matching required lock check fails at once; (2) this job
  # measures the head commit ONCE on the CI runner (Linux) and writes the baseline (no compare here);
  # (3) with an installation token of the GitHub App toolora-baseline-bot-4jty it removes the label(s), then
  # commits the baseline to the PR branch and pushes. Unlike a GITHUB_TOKEN push, an App push starts a normal
  # pull_request run (no "action_required" gate, PR #9). The labels go first so that run no longer carries
  # them; an unchanged baseline still gets an empty commit, so a run always starts.
  # (4) that run compares against the committed baseline, so only then can the locks pass.
  # pull_request only (never pull_request_target): a fork never gets the App secrets. It runs the PR's code
  # next to a write token, which is safe only because a same-repository PR author already has write access.
  regenerate-baselines:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(github.event.pull_request.labels.*.name, 'approve-desktop-baseline') ||
      contains(github.event.pull_request.labels.*.name, 'approve-home-phone-baseline'))
    # One approval per PR at a time: a second run (label + push together) waits instead of racing the push.
    concurrency:
      group: regenerate-baselines-${{ github.event.pull_request.number }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # The App token does every write; GITHUB_TOKEN stays read-only.
    permissions:
      contents: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Mint the baseline bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TOOLORA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.TOOLORA_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # The labels in the event are a snapshot: skip when an earlier run already did the approval or the
      # branch has moved on (its own run carries the label and does the work).
      - name: Is the approval still pending on this head?
        id: pending
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          head=$(jq -r .head.sha <<<"$pr")
          labels=$(jq -r '[.labels[].name] | join(",")' <<<"$pr")
          desktop=false; phone=false
          [[ ",$labels," == *",approve-desktop-baseline,"* ]] && desktop=true
          [[ ",$labels," == *",approve-home-phone-baseline,"* ]] && phone=true
          if [ "$head" != "$HEAD_SHA" ]; then echo "The branch moved to $head; its own run does the approval."; desktop=false; phone=false; fi
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "phone=$phone" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pending.outputs.desktop == 'true' || steps.pending.outputs.phone == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.app-token.outputs.token }}
          # Not left in .git/config while the PR's code runs; the push step passes it explicitly.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.pending.outputs.desktop == 'true' || steps.pending.outputs.phone == 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        if: steps.pending.outputs.desktop == 'true' || steps.pending.outputs.phone == 'true'
        uses: ./.github/actions/npm-ci

      - name: Install Playwright Chromium
        if: steps.pending.outputs.desktop == 'true' || steps.pending.outputs.phone == 'true'
        run: npx playwright install --with-deps chromium

      - name: Write the Linux phone home baseline (one measurement)
        if: steps.pending.outputs.phone == 'true'
        run: |
          npm run build --workspace=apps/web
          scripts/test-server.sh start 3110 apps/web /ar
          npm run baseline:home-phone -- --approve --base http://localhost:3110
          scripts/test-server.sh stop 3110

      - name: Write the Linux desktop baseline (one measurement)
        if: steps.pending.outputs.desktop == 'true'
        run: |
          npm run build:desktop-lock
          npm run baseline:desktop-lock -- --approve

      - name: Remove the labels, then commit and push the baselines as the App
        if: steps.pending.outputs.desktop == 'true' || steps.pending.outputs.phone == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APPROVE_DESKTOP: ${{ steps.pending.outputs.desktop }}
          APPROVE_PHONE: ${{ steps.pending.outputs.phone }}
        run: |
          if [ "$APPROVE_DESKTOP" = "true" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/approve-desktop-baseline" > /dev/null
          fi
          if [ "$APPROVE_PHONE" = "true" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/approve-home-phone-baseline" > /dev/null
          fi
          bot_id=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add tests/baselines/*.linux.json
          if git diff --cached --quiet; then
            echo "The Linux baselines are unchanged; an empty commit re-runs the required checks."
            git commit --allow-empty -m "test: approved Linux baseline unchanged (CI)" -m "Written by the approve-*-baseline label on PR #$PR_NUMBER."
          else
            git commit -m "test: commit the approved Linux baseline from CI" -m "Written by the approve-*-baseline label on PR #$PR_NUMBER."
          fi
          # Pushes onto the head commit it measured: if the branch moved meanwhile, the push is rejected.
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$HEAD_REF"

  # Required check. Fails if any job of this run left a warning or failure annotation (GitHub deprecations
  # included), so a warning can never merge unnoticed. always(): it still reports when a job failed or was
  # skipped. Check runs are found by their details URL (this run's id), so only checks: read is needed.
  zero-warnings:
    needs: [build, home-phone-lock, desktop-lock, affected, site-audit-shard, site-audit, perf-budget-shard, perf-budget, gates-self-test, regenerate-baselines]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/zero-warnings.sh
          sparse-checkout-cone-mode: false

      - name: No warning or failure annotation in this run
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          SELF: zero-warnings
        run: scripts/zero-warnings.sh
