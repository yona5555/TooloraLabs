name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Typecheck (core)
        run: npx tsc --noEmit --project packages/core/tsconfig.json

      - name: Typecheck (sdk)
        run: npx tsc --noEmit --project packages/sdk/tsconfig.json

      - name: Typecheck (tools)
        run: npx tsc --noEmit --project packages/tools/tsconfig.json

      - name: Build web app
        run: npm run build --workspace=apps/web
