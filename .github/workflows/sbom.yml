name: SBOM

# CycloneDX SBOM of the production dependency tree, read from the lockfile (no install needed).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Generate the CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev --package-lock-only > sbom.cdx.json

      - name: Valid JSON with at least one component
        run: |
          count=$(jq '.components | length' sbom.cdx.json)
          echo "Components: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::The SBOM has zero components"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
          if-no-files-found: error
