name: Audit

# Required check. No paths filters: a required check that never reports blocks the merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC

permissions:
  contents: read

# Every run step is bash with pipefail (bash --noprofile --norc -eo pipefail): a failure anywhere in a pipeline fails
# the step, so no pipe can hide a gate's exit code (scripts/workflow-shell.mjs enforces this).
defaults:
  run:
    shell: bash

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # No install scripts: the audit needs the tree, not built packages.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Known vulnerabilities (any severity fails)
        run: npm audit --audit-level=low

      - name: Registry signatures and provenance attestations
        run: npm audit signatures

  # Required check: the audit job left no warning or failure annotation; the same fail-on-warning gate as ci.yml's zero-warnings (scripts/zero-warnings.sh).
  audit-zero-warnings:
    needs: [audit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/zero-warnings.sh
          sparse-checkout-cone-mode: false

      - name: No warning or failure annotation in this run
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          SELF: audit-zero-warnings
        run: scripts/zero-warnings.sh
